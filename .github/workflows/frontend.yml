name: Frontend and desktop bridge
on:
  push:
    branches: [main]
    paths: ["frontend/**", "src-tauri/**", "rust/weather-core/**", "sharpmod/bridge/**", "sharpmod/resources/basemap.json", "pyproject.toml", "constraints/release.txt", "scripts/install_sharppy_compat.py", ".github/workflows/frontend.yml"]
  pull_request:
    branches: [main]
    paths: ["frontend/**", "src-tauri/**", "rust/weather-core/**", "sharpmod/bridge/**", "sharpmod/resources/basemap.json", "pyproject.toml", "constraints/release.txt", "scripts/install_sharppy_compat.py", ".github/workflows/frontend.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend-checks:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ inputs.ref || github.sha }}", persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24.12.0", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.13", cache: pip }
      - name: Require the real Python boundary in UI tests
        working-directory: .
        shell: pwsh
        run: |
          python -m pip install --constraint constraints/release.txt -e ".[render]"
          if ($LASTEXITCODE -ne 0) { throw "Python boundary dependencies failed" }
          python scripts/install_sharppy_compat.py --sharppy-only
          if ($LASTEXITCODE -ne 0) { throw "SHARPpy compatibility install failed" }
          "SHARPPY_PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV
      - run: npm run typecheck
      - run: npm run lint
      - name: Audit production frontend dependencies
        run: npm audit --omit=dev
      - run: npm test
      - run: npm run build
      - run: npm run build:browser
      - run: npm run build:fixture
  browser:
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ inputs.ref || github.sha }}", persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24.12.0", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build:fixture
      - name: Test browser workflows against the desktop CSP
        run: npm run e2e -- --shard=${{ matrix.shard }}/4
        env:
          E2E_SWIFTSHADER: "1"
          E2E_SCREENSHOT_DIR: ${{ runner.temp }}/e2e-screenshots
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-failure-diagnostics-${{ matrix.shard }}
          path: |
            frontend/test-results
            ${{ runner.temp }}/e2e-screenshots
          if-no-files-found: ignore
          retention-days: 7
  frontend:
    needs: [frontend-checks, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every frontend check and browser shard
        env:
          CHECKS_RESULT: ${{ needs.frontend-checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$BROWSER_RESULT" = success
  desktop-bridge:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: src-tauri } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ inputs.ref || github.sha }}", persist-credentials: false }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: tauri-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: rustup update stable --no-self-update && rustup default stable
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Cache cargo-audit
        id: cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit.exe
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2
      - name: Install cargo-audit on cache miss
        if: steps.cargo-audit.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          if ($LASTEXITCODE -ne 0) { throw "Dependency audit tool install failed" }
      - name: Audit locked desktop and scientific dependencies
        run: |
          cargo audit --file Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw "Desktop dependency audit failed" }
          cargo audit --file ../rust/sharpmod-rs/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw "Scientific dependency audit failed" }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.13", cache: pip }
      - name: Install the real sidecar for lifecycle checks
        working-directory: .
        shell: pwsh
        run: |
          python -m pip install --constraint constraints/release.txt -e ".[render]"
          if ($LASTEXITCODE -ne 0) { throw "Sidecar dependencies failed" }
          python scripts/install_sharppy_compat.py --sharppy-only
          if ($LASTEXITCODE -ne 0) { throw "SHARPpy compatibility install failed" }
          "SHARPPY_PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV
      - name: Require normal and forced sidecar cleanup
        run: cargo test --locked --test python_sidecar -- --ignored --test-threads=1
