name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (must match the package version, e.g. v0.8.2). Created if it does not exist."
        required: true
        default: "v0.8.2"

# Build and test jobs have no repository write permission. A dedicated job can
# write only provenance attestations, and only the isolated publish job can
# create a tag or GitHub Release.
permissions:
  contents: read

jobs:
  resolve-release:
    name: Resolve and validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      tag_exists: ${{ steps.release.outputs.tag_exists }}
      source_sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Resolve release tag and source
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          EVENT_TAG: ${{ github.ref_name }}
          REMOTE_URL: https://github.com/${{ github.repository }}.git
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="$EVENT_TAG"
          fi
          if ! git check-ref-format "refs/tags/$tag" >/dev/null; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          tag_exists=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')
            set +e
            git -c "http.extraheader=AUTHORIZATION: basic $auth" \
              ls-remote --exit-code --refs "$REMOTE_URL" "refs/tags/$tag" \
              >/dev/null 2>&1
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              checkout_ref="refs/tags/$tag"
              tag_exists=true
            elif [ "$status" -eq 2 ]; then
              checkout_ref="$GITHUB_SHA"
            else
              echo "Unable to determine whether release tag $tag exists" >&2
              exit "$status"
            fi
          else
            checkout_ref="$GITHUB_SHA"
            tag_exists=true
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'checkout_ref=%s\n' "$checkout_ref" >> "$GITHUB_OUTPUT"
          printf 'tag_exists=%s\n' "$tag_exists" >> "$GITHUB_OUTPUT"

      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.checkout_ref }}
          persist-credentials: false

      - name: Record immutable release source
        id: source
        shell: bash
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate release tag and source versions
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import tomllib

          root = Path.cwd()
          version_source = (root / "sharpmod/_version.py").read_text(encoding="utf-8")
          match = re.search(
              r'^__version__\s*=\s*["\']([^"\']+)["\']',
              version_source,
              flags=re.MULTILINE,
          )
          if match is None:
              raise SystemExit("sharpmod/_version.py does not define __version__")
          python_version = match.group(1)
          cargo_version = tomllib.loads(
              (root / "rust/sharpmod-rs/Cargo.toml").read_text(encoding="utf-8")
          )["package"]["version"]
          maturin_version = tomllib.loads(
              (root / "rust/sharpmod-rs/pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          lock_packages = [
              package
              for package in tomllib.loads(
                  (root / "rust/sharpmod-rs/Cargo.lock").read_text(
                      encoding="utf-8"
                  )
              )["package"]
              if package.get("name") == "sharpmod-rs"
          ]
          if len(lock_packages) != 1:
              raise SystemExit(
                  "Cargo.lock must contain exactly one sharpmod-rs package"
              )
          lock_version = lock_packages[0]["version"]

          versions = {
              "sharpmod/_version.py": python_version,
              "rust/sharpmod-rs/Cargo.toml": cargo_version,
              "rust/sharpmod-rs/pyproject.toml": maturin_version,
              "rust/sharpmod-rs/Cargo.lock": lock_version,
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f"release source versions do not match: {versions}")

          expected_tag = f"v{python_version}"
          release_tag = os.environ["RELEASE_TAG"].strip()
          if release_tag != expected_tag:
              raise SystemExit(
                  f"release tag {release_tag!r} must equal {expected_tag!r}"
              )
          print(f"Validated {release_tag} against {versions}")
          PY

  test-release:
    name: Test exact release source
    needs: resolve-release
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.resolve-release.outputs.source_sha }}
      run_live_providers: false
      run_serial_release: true

  build-windows-exe:
    name: Build Windows downloads
    needs: [resolve-release, test-release]
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    env:
      SHARPMOD_BACKEND: "rust"
      SHARPMOD_REQUIRE_RUST: "1"
      SHARPMOD_RELEASE_BUILD: "1"

    steps:
      - name: Check out tested release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}
          persist-credentials: false

      - name: Clean generated package metadata and build outputs
        shell: pwsh
        run: |
          $generated = @(
            Get-ChildItem -LiteralPath "." -Force -Directory |
              Where-Object {
                $_.Name -match '^sharpmod(?:[-_]\d.*)?\.(egg|dist)-info$'
              }
          )
          foreach ($path in $generated) {
            Remove-Item -LiteralPath $path.FullName -Recurse -Force
          }
          foreach ($path in @("build", "dist", "release-artifacts", "release-staging", "rust/sharpmod-rs/dist")) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
          }

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Rust 1.88 toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version | grep -E '^rustc 1\.88\.0 '

      - name: Install constrained package and build dependencies
        shell: pwsh
        run: |
          $constraint = (Resolve-Path "constraints/release.txt").Path
          $env:PIP_CONSTRAINT = $constraint
          python -m pip install --upgrade --constraint $constraint pip
          python -m pip install --constraint $constraint `
            ".[render,era5,wrf]"
          python scripts/install_sharppy_compat.py --sharppy-only
          python -m pip install --constraint $constraint pyinstaller maturin
          python -m pip check
          Get-ChildItem -LiteralPath "." -Force -Directory |
            Where-Object {
              $_.Name -match '^sharpmod(?:[-_]\d.*)?\.(egg|dist)-info$'
            } |
            ForEach-Object {
              Remove-Item -LiteralPath $_.FullName -Recurse -Force
            }

      - name: Verify canonical installed package metadata
        run: >-
          python packaging/release_contract.py
          --repo-root .
          --require-dist-info
          --require-external-metadata

      - name: Build and install locked Rust wheel
        shell: pwsh
        run: |
          Push-Location "rust/sharpmod-rs"
          try {
            python -m maturin build --release --locked --interpreter python --out dist
            if ($LASTEXITCODE -ne 0) {
              throw "Locked Rust wheel build failed"
            }
          }
          finally {
            Pop-Location
          }
          $wheels = @(
            Get-ChildItem -LiteralPath "rust/sharpmod-rs/dist" `
              -Filter "sharpmod_rs-*-cp311-cp311-win_amd64.whl" -File
          )
          if ($wheels.Count -ne 1) {
            throw "Expected one CPython 3.11 Windows Rust wheel, found $($wheels.Count)"
          }
          python -m pip install --force-reinstall --no-deps $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Rust wheel installation failed"
          }

      - name: Verify installed Rust backend
        shell: python
        run: |
          import importlib.metadata

          import sharpmod
          import sharpmod_rs
          from sharpmod.backends import backend_info, wind_to_components

          info = backend_info()
          assert info["requested_backend"] == "rust", info
          assert info["active_backend"] == "rust", info
          assert info["rust_installed"] is True, info
          assert info["rust_version"] == sharpmod.__version__, info
          assert info["fallback_reason"] is None, info
          assert sharpmod_rs.__version__ == sharpmod.__version__
          assert importlib.metadata.version("sharpmod-rs") == sharpmod.__version__
          u_component, v_component = wind_to_components(270.0, 10.0)
          assert abs(u_component - 10.0) <= 1.0e-12
          assert abs(v_component) <= 1.0e-12
          print(info)

      - name: Generate application icon
        run: python packaging/make_icon.py

      - name: Build one-folder executable
        run: pyinstaller packaging/sharpmod_gui.spec --noconfirm

      - name: Build portable single-file executable
        env:
          SHARPMOD_ONEFILE: "1"
        run: pyinstaller packaging/sharpmod_gui.spec --noconfirm

      - name: Select Windows signing provider
        id: signing-provider
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $pfxFields = @(
            $env:WINDOWS_SIGNING_CERTIFICATE_BASE64,
            $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD
          )
          $pfxCount = @(
            $pfxFields | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          ).Count
          if ($pfxCount -ne 0 -and $pfxCount -ne $pfxFields.Count) {
            throw "Configure both WINDOWS_SIGNING_CERTIFICATE_BASE64 and WINDOWS_SIGNING_CERTIFICATE_PASSWORD, or neither"
          }

          $signPathFields = @(
            $env:SIGNPATH_API_TOKEN,
            $env:SIGNPATH_ORGANIZATION_ID,
            $env:SIGNPATH_PROJECT_SLUG,
            $env:SIGNPATH_SIGNING_POLICY_SLUG,
            $env:SIGNPATH_ARTIFACT_CONFIGURATION_SLUG
          )
          $signPathCount = @(
            $signPathFields | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          ).Count
          if ($signPathCount -ne 0 -and $signPathCount -ne $signPathFields.Count) {
            throw "Configure every SIGNPATH_* secret/variable, or none of them"
          }
          if ($pfxCount -gt 0 -and $signPathCount -gt 0) {
            throw "Configure exactly one Windows signing provider, not both PFX and SignPath"
          }

          $provider = if ($signPathCount -gt 0) {
            "SignPath"
          }
          elseif ($pfxCount -gt 0) {
            "PFX"
          }
          else {
            Write-Warning "No signing provider configured; release artifacts will be explicitly marked unsigned"
            "Unsigned"
          }
          "provider=$provider" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Sign Windows executables with PFX
        if: steps.signing-provider.outputs.provider == 'PFX'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          $certificateBase64 = $env:WINDOWS_SIGNING_CERTIFICATE_BASE64
          $certificatePassword = $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD

          $signToolCommand = Get-Command "signtool.exe" -ErrorAction SilentlyContinue
          $signToolPath = if ($null -ne $signToolCommand) {
            $signToolCommand.Source
          }
          else {
            $kitsRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits/10/bin"
            $candidate = Get-ChildItem -LiteralPath $kitsRoot -Filter "signtool.exe" `
              -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '[\\/]x64[\\/]signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($null -eq $candidate) { $null } else { $candidate.FullName }
          }
          if ([string]::IsNullOrWhiteSpace($signToolPath)) {
            throw "Signing credentials were supplied, but signtool.exe was not found"
          }

          $timestampUrl = $env:WINDOWS_SIGNING_TIMESTAMP_URL
          if ([string]::IsNullOrWhiteSpace($timestampUrl)) {
            $timestampUrl = "http://timestamp.digicert.com"
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "sharpmod-signing.pfx"
          $targets = @(
            "dist/SHARPpy-Reimagined/SHARPpy-Reimagined.exe",
            "dist/SHARPpy-Reimagined.exe"
          )
          try {
            $certificateBytes = [Convert]::FromBase64String(
              ($certificateBase64 -replace '\s', '')
            )
            [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
            foreach ($target in $targets) {
              & $signToolPath sign /fd SHA256 /td SHA256 /tr $timestampUrl `
                /f $certificatePath /p $certificatePassword $target
              if ($LASTEXITCODE -ne 0) {
                throw "Authenticode signing failed for $target"
              }
              & $signToolPath verify /pa /all $target
              if ($LASTEXITCODE -ne 0) {
                throw "Authenticode verification failed for $target"
              }
            }
          }
          finally {
            if (Test-Path -LiteralPath $certificatePath) {
              Remove-Item -LiteralPath $certificatePath -Force
            }
          }

      - name: Stage Windows executables for SignPath
        id: signpath-input
        if: steps.signing-provider.outputs.provider == 'SignPath'
        shell: pwsh
        run: |
          $version = (& python -c "from sharpmod._version import __version__; print(__version__)").Trim()
          New-Item -ItemType Directory -Path "signpath-input/recommended" -Force | Out-Null
          New-Item -ItemType Directory -Path "signpath-input/portable" -Force | Out-Null
          Copy-Item -LiteralPath "dist/SHARPpy-Reimagined/SHARPpy-Reimagined.exe" `
            -Destination "signpath-input/recommended/SHARPpy-Reimagined.exe"
          Copy-Item -LiteralPath "dist/SHARPpy-Reimagined.exe" `
            -Destination "signpath-input/portable/SHARPpy-Reimagined.exe"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload unsigned executables for SignPath
        id: upload-unsigned-signpath
        if: steps.signing-provider.outputs.provider == 'SignPath'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-windows-signpath-${{ needs.resolve-release.outputs.tag }}
          path: |
            signpath-input/recommended/SHARPpy-Reimagined.exe
            signpath-input/portable/SHARPpy-Reimagined.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Submit SignPath signing request
        if: steps.signing-provider.outputs.provider == 'SignPath'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-signpath.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signpath-output
          parameters: |
            version: ${{ toJSON(steps.signpath-input.outputs.version) }}

      - name: Install and verify SignPath-signed executables
        if: steps.signing-provider.outputs.provider == 'SignPath'
        shell: pwsh
        run: |
          $signedTargets = @(
            @{
              Source = "signpath-output/recommended/SHARPpy-Reimagined.exe"
              Destination = "dist/SHARPpy-Reimagined/SHARPpy-Reimagined.exe"
            },
            @{
              Source = "signpath-output/portable/SHARPpy-Reimagined.exe"
              Destination = "dist/SHARPpy-Reimagined.exe"
            }
          )
          foreach ($target in $signedTargets) {
            if (-not (Test-Path -LiteralPath $target.Source -PathType Leaf)) {
              throw "SignPath output is missing $($target.Source)"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $target.Source
            if ($signature.Status -ne "Valid") {
              throw "SignPath output has invalid Authenticode status $($signature.Status): $($target.Source)"
            }
            Copy-Item -LiteralPath $target.Source -Destination $target.Destination -Force
          }

      - name: Record Windows signing result
        id: signing
        shell: pwsh
        env:
          SIGNING_PROVIDER: ${{ steps.signing-provider.outputs.provider }}
        run: |
          $provider = $env:SIGNING_PROVIDER
          $mode = if ($provider -eq "Unsigned") { "Unsigned" } else { "Signed" }
          "provider=$provider" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "mode=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify recommended one-folder artifact
        shell: pwsh
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          $expectedVersion = (& python -c "from sharpmod._version import __version__; print(__version__)").Trim()
          & "packaging/verify_windows_artifact.ps1" `
            -Executable "dist/SHARPpy-Reimagined/SHARPpy-Reimagined.exe" `
            -ExpectedVersion $expectedVersion `
            -SigningMode $env:SIGNING_MODE
          $report = Join-Path $env:RUNNER_TEMP "model-fetch-runtime.json"
          $process = Start-Process `
            -FilePath "dist/SHARPpy-Reimagined/SHARPpy-Reimagined.exe" `
            -ArgumentList "--model-fetch-runtime-check", $report `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $report) { Get-Content $report }
            throw "Frozen model-fetch runtime check failed"
          }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.version_consistent -or `
              $result.versions.sharpmod -ne $expectedVersion -or `
              $result.versions.sharpmod_metadata -ne $expectedVersion -or `
              $result.versions.sharpmod_rs -ne $expectedVersion -or `
              $result.versions.sharpmod_rs_metadata -ne $expectedVersion -or `
              $result.versions.backend_rust -ne $expectedVersion -or `
              -not $result.backend_kernel_ok -or `
              -not $result.wrf_runtime_ok -or `
              $result.backend.requested_backend -ne "rust" -or `
              $result.backend.active_backend -ne "rust" -or `
              -not $result.backend.rust_installed -or `
              [string]::IsNullOrWhiteSpace([string]$result.backend.rust_version) -or `
              $null -ne $result.backend.fallback_reason -or `
              $result.configured_models -lt 1 -or `
              -not $result.logging_handlers -or -not $result.gui_entrypoint) {
            $result | ConvertTo-Json -Depth 5
            throw "Frozen model-fetch runtime report is invalid"
          }
          $result | ConvertTo-Json -Depth 5

      - name: Verify portable single-file artifact
        shell: pwsh
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          $expectedVersion = (& python -c "from sharpmod._version import __version__; print(__version__)").Trim()
          & "packaging/verify_windows_artifact.ps1" `
            -Executable "dist/SHARPpy-Reimagined.exe" `
            -ExpectedVersion $expectedVersion `
            -SigningMode $env:SIGNING_MODE
          $report = Join-Path $env:RUNNER_TEMP "single-file-runtime.json"
          $process = Start-Process `
            -FilePath "dist/SHARPpy-Reimagined.exe" `
            -ArgumentList "--model-fetch-runtime-check", $report `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $report) { Get-Content $report }
            throw "Frozen single-file runtime check failed"
          }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.version_consistent -or `
              $result.versions.sharpmod -ne $expectedVersion -or `
              $result.versions.sharpmod_metadata -ne $expectedVersion -or `
              $result.versions.sharpmod_rs -ne $expectedVersion -or `
              $result.versions.sharpmod_rs_metadata -ne $expectedVersion -or `
              $result.versions.backend_rust -ne $expectedVersion -or `
              -not $result.backend_kernel_ok -or `
              -not $result.wrf_runtime_ok -or `
              $result.backend.requested_backend -ne "rust" -or `
              $result.backend.active_backend -ne "rust" -or `
              -not $result.backend.rust_installed -or `
              [string]::IsNullOrWhiteSpace([string]$result.backend.rust_version) -or `
              $null -ne $result.backend.fallback_reason -or `
              $result.configured_models -lt 1 -or `
              -not $result.logging_handlers -or -not $result.gui_entrypoint) {
            $result | ConvertTo-Json -Depth 5
            throw "Frozen single-file runtime report is invalid"
          }
          $result | ConvertTo-Json -Depth 5

      - name: Stage clearly labeled release artifacts
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_SOURCE_SHA: ${{ needs.resolve-release.outputs.source_sha }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          SIGNING_PROVIDER: ${{ steps.signing.outputs.provider }}
        run: |
          New-Item -ItemType Directory -Path "release-artifacts" -Force | Out-Null
          New-Item -ItemType Directory -Path "release-staging" -Force | Out-Null
          Copy-Item -LiteralPath "dist/SHARPpy-Reimagined" `
            -Destination "release-staging/SHARPpy-Reimagined" -Recurse

          $recommendedName = "SHARPpy-Reimagined-$env:RELEASE_TAG-windows-x64.zip"
          $portableName = "SHARPpy-Reimagined-$env:RELEASE_TAG-windows-x64-portable.exe"
          @"
          SHARPpy Reimagined $env:RELEASE_TAG for Windows x64

          This one-folder package is the recommended Windows download because it starts
          substantially faster than the self-extracting portable executable.

          Extract the entire SHARPpy-Reimagined folder, keep its _internal directory
          beside the executable, and run SHARPpy-Reimagined.exe.

          Authenticode status for this release: $env:SIGNING_MODE
          Signing provider: $env:SIGNING_PROVIDER
          "@ | Set-Content -Encoding utf8 `
            "release-staging/SHARPpy-Reimagined/README-WINDOWS.txt"
          Compress-Archive -Path "release-staging/SHARPpy-Reimagined" `
            -DestinationPath "release-artifacts/$recommendedName" -Force
          Copy-Item "dist/SHARPpy-Reimagined.exe" `
            "release-artifacts/$portableName"
          Copy-Item "rust/sharpmod-rs/dist/*.whl" "release-artifacts/"
          python -m pip freeze --all |
            Set-Content -Encoding utf8 `
              "release-artifacts/SHARPpy-Reimagined-$env:RELEASE_TAG-dependencies.txt"

          $sourceVersion = (& python -c "from sharpmod._version import __version__; print(__version__)").Trim()
          [ordered]@{
            product = "SHARPpy Reimagined"
            version = $sourceVersion
            source_sha = $env:RELEASE_SOURCE_SHA
            authenticode = $env:SIGNING_MODE.ToLowerInvariant()
            signing_provider = $env:SIGNING_PROVIDER
            recommended_artifact = $recommendedName
            portable_artifact = $portableName
            portable_note = "Self-extracting convenience build; slower startup than the recommended one-folder ZIP."
          } | ConvertTo-Json | Set-Content -Encoding utf8 `
            "release-artifacts/SHARPpy-Reimagined-$env:RELEASE_TAG-manifest.json"
          "Authenticode status: $env:SIGNING_MODE" | Set-Content -Encoding ascii `
            "release-artifacts/SHARPpy-Reimagined-$env:RELEASE_TAG-Authenticode-$env:SIGNING_MODE.txt"

          $checksumLines = @(
            Get-ChildItem -LiteralPath "release-artifacts" -File |
              Sort-Object Name |
              ForEach-Object {
                $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                "$hash  $($_.Name)"
              }
          )
          $checksumLines | Set-Content -Encoding ascii `
            "release-artifacts/SHARPpy-Reimagined-$env:RELEASE_TAG-SHA256SUMS.txt"

      - name: Upload tested release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-release-${{ needs.resolve-release.outputs.tag }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  attest-windows-release:
    name: Attest Windows release provenance
    needs: [resolve-release, build-windows-exe]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Download tested release artifacts for attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-release-${{ needs.resolve-release.outputs.tag }}
          path: release-artifacts

      - name: Attest tested release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-artifacts/*

  publish:
    name: Publish GitHub Release
    needs: [resolve-release, test-release, build-windows-exe, attest-windows-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download tested release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-release-${{ needs.resolve-release.outputs.tag }}
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.resolve-release.outputs.tag }}
          target_commitish: ${{ needs.resolve-release.outputs.source_sha }}
          name: SHARPpy Reimagined ${{ needs.resolve-release.outputs.tag }}
          generate_release_notes: true
          body: |
            **Recommended Windows download:** `SHARPpy-Reimagined-${{ needs.resolve-release.outputs.tag }}-windows-x64.zip`

            Extract the ZIP and run `SHARPpy-Reimagined.exe` inside its folder. This one-folder build starts substantially faster than the self-extracting portable executable.

            The file ending in `portable.exe` is retained for single-file convenience and starts more slowly because it self-extracts at launch. The release manifest states explicitly whether these executables were Authenticode-signed.

            **Code signing policy:** https://github.com/ShianMike/SHARPpy-Reimagined/blob/main/CODE_SIGNING_POLICY.md

            Verify GitHub build provenance after downloading an asset with `gh attestation verify PATH-TO-ASSET --repo ShianMike/SHARPpy-Reimagined`.
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove stale release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')

          for stale in \
            "SHARPpy-Reimagined-$RELEASE_TAG-windows-x64-RECOMMENDED.zip" \
            "SHARPpy-Reimagined-$RELEASE_TAG-windows-x64-portable-slower-startup.exe"
          do
            if printf '%s\n' "$assets" | grep -Fxq -- "$stale"; then
              gh release delete-asset "$RELEASE_TAG" "$stale" --yes
            fi
          done

          if compgen -G 'release-artifacts/*-Authenticode-Signed.txt' >/dev/null; then
            stale="SHARPpy-Reimagined-$RELEASE_TAG-Authenticode-Unsigned.txt"
          else
            stale="SHARPpy-Reimagined-$RELEASE_TAG-Authenticode-Signed.txt"
          fi
          if printf '%s\n' "$assets" | grep -Fxq -- "$stale"; then
            gh release delete-asset "$RELEASE_TAG" "$stale" --yes
          fi
