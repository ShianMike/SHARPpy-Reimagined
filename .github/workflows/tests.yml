name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xinput0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,era5,wrf,render]"
          python scripts/install_sharppy_compat.py --sharppy-only

      - name: Run tests
        run: pytest

  windows-wrf:
    name: Windows WRF runtime
    runs-on: windows-latest
    timeout-minutes: 25

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install WRF and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,wrf,render]"
          python scripts/install_sharppy_compat.py --sharppy-only

      - name: Exercise a real NetCDF4 WRF file
        run: >-
          python -m pytest -q
          sharpmod/tests/test_gui_reanalysis_wrf.py
          sharpmod/tests/test_model_fetch_packaging.py
