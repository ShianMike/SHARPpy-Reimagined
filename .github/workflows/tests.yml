name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly live-provider drift check. Deterministic lanes still run on every
    # push/PR; this lane exercises current public schemas and terrain.
    - cron: "17 10 * * 2"
  workflow_call:
    inputs:
      ref:
        description: Exact commit or ref to test
        required: false
        default: ""
        type: string
      run_live_providers:
        description: Run opt-in public-provider contracts
        required: false
        default: false
        type: boolean
      run_serial_release:
        description: Run the complete single-process release gate
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or ref to test (blank uses the selected ref)
        required: false
        default: ""
        type: string
      run_live_providers:
        description: Run timeout-bounded public-provider contracts
        required: false
        default: false
        type: boolean
      run_serial_release:
        description: Run the complete single-process release gate
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  SHARPMOD_TEST_WORKERS: "4"

jobs:
  compatibility:
    name: Compatibility smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - &install_qt
        name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xinput0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,era5,wrf,render]"
          python scripts/install_sharppy_compat.py --sharppy-only
          python -m pip check

      - name: Run bounded all-offline compatibility smoke
        run: python scripts/run_test_lane.py compatibility --workers 4

      - name: Upload compatibility timing artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-timing-compatibility-python-${{ matrix.python-version }}
          path: .test-results/compatibility*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  fast:
    name: Deterministic and coverage (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - *install_qt

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and coverage dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,quality,era5,wrf,render]"
          python scripts/install_sharppy_compat.py --sharppy-only
          python -m pip check

      - &install_rust_backend
        name: Build and install the Rust backend
        # Hosted runners used to test only the pure-Python fallback, which costs
        # roughly 6.7x on the parcel/kinematics kernels and made the serial gate
        # the whole release's critical path. The three heavy lanes now exercise
        # the accelerated backend that actually ships; the compatibility matrix
        # deliberately stays on the fallback, so that path keeps full-suite
        # coverage on 3.11 and 3.12.
        #
        # SHARPMOD_BACKEND is set per lane step rather than on the job, because
        # forcing it here would make the dependency install above fail while the
        # extension is still absent.
        run: |
          python -m pip install "maturin>=1.15,<2"
          (cd rust/sharpmod-rs && python -m maturin build --release --locked --interpreter python --out dist)
          python -m pip install --force-reinstall --no-deps rust/sharpmod-rs/dist/*.whl
          python -c "from sharpmod.backends import backend_info; info = backend_info(); assert info['active_backend'] == 'rust', info; assert info['rust_installed'] is True, info; print('backend:', info)"

      - name: Run grouped deterministic lane with coverage
        env:
          SHARPMOD_BACKEND: rust
        run: >-
          python scripts/run_test_lane.py fast
          --workers 4
          --coverage
          --coverage-xml coverage.xml

      - name: Upload coverage and timing reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-and-timing-python-3.13
          path: |
            coverage.xml
            .test-results/fast*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  property:
    name: Full properties (${{ matrix.backend }}, Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        # The >=100-example scientific contract has to hold on both compute
        # paths that ship: the Rust extension the installer delivers, and the
        # pure-Python fallback used wherever that wheel is unavailable.
        #
        # Running only one of them would leave a real hole. The compatibility
        # matrix covers the fallback across the whole suite but at ten
        # examples, so a fallback-only disagreement that needs deeper search to
        # surface would otherwise reach a release unseen. Both legs finish well
        # inside the serial gate, so this costs no critical path.
        include:
          # Two CPU-heavy fallback workers completed the full local lane in
          # 214s with every tracked test under budget. Four workers inflated
          # individual fallback timings through contention (312s overall).
          - backend: python
            workers: 2
          - backend: rust
            workers: 4

    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - *install_qt

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install full property-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,era5,wrf,render]"
          python scripts/install_sharppy_compat.py --sharppy-only
          python -m pip check

      # Written out rather than reusing the anchor above: this is the one lane
      # that must also run without the extension, and a plain matrix condition
      # is clearer than relying on how GitHub coerces an undefined context.
      - name: Build and install the Rust backend
        if: ${{ matrix.backend == 'rust' }}
        run: |
          python -m pip install "maturin>=1.15,<2"
          (cd rust/sharpmod-rs && python -m maturin build --release --locked --interpreter python --out dist)
          python -m pip install --force-reinstall --no-deps rust/sharpmod-rs/dist/*.whl
          python -c "from sharpmod.backends import backend_info; info = backend_info(); assert info['active_backend'] == 'rust', info; assert info['rust_installed'] is True, info; print('backend:', info)"

      - name: Run full property lane
        env:
          SHARPMOD_BACKEND: ${{ matrix.backend }}
        run: python scripts/run_test_lane.py property --workers ${{ matrix.workers }}

      - name: Upload property timing artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-timing-property-${{ matrix.backend }}-python-3.13
          path: .test-results/property*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  serial-release:
    name: Complete serial release gate (Python 3.13)
    # This is an exact-source release check, requested by release.yml. The
    # deterministic/property/version lanes already run on main, so also running
    # this 3,000+ test single-process pass there duplicated it on release day.
    if: ${{ inputs.run_serial_release == true }}
    runs-on: ubuntu-latest
    # The pre-optimization v1.1.0 lane completed in 34.6 minutes. Keep bounded
    # headroom while preventing a regression from consuming the former 75-minute
    # allowance before GitHub can stop it.
    timeout-minutes: 45

    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - *install_qt

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install complete offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,era5,wrf,render]"
          python scripts/install_sharppy_compat.py --sharppy-only
          python -m pip check

      - *install_rust_backend

      - name: Run every offline test in one process
        env:
          SHARPMOD_BACKEND: rust
        run: python scripts/run_test_lane.py serial-release

      - name: Upload serial timing artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-timing-serial-release-python-3.13
          path: .test-results/serial-release*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  windows-wrf:
    name: Windows WRF runtime
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install WRF and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,wrf,render]"
          python scripts/install_sharppy_compat.py --sharppy-only

      - name: Exercise a real NetCDF4 WRF file
        run: python scripts/run_test_lane.py windows-wrf

      - name: Upload Windows WRF timing artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-timing-windows-wrf-python-3.13
          path: .test-results/windows-wrf*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: Static quality and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install audited dependency surface
        run: |
          python -m pip install --upgrade \
            --constraint constraints/release.txt \
            pip setuptools wheel
          python -m pip install -e ".[quality,era5,wrf,render]"
          python scripts/install_sharppy_compat.py --sharppy-only
          python -m pip check

      - name: Run repository correctness lint
        run: python -m ruff check sharpmod scripts packaging

      - name: Run focused maintainability lint
        run: >-
          python -m ruff check
          sharpmod/portable_sounding.py
          sharpmod/model_disk_cache.py
          sharpmod/model_sources.py
          sharpmod/gui_cache.py
          --select E,F,I,UP,B,SIM

      - name: Audit installed dependencies
        run: python -m pip_audit --skip-editable

  live-provider:
    name: Live provider contracts
    if: ${{ inputs.run_live_providers == true || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - *install_qt

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install provider runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,era5,render]"
          python scripts/install_sharppy_compat.py --sharppy-only

      - name: Run current public-provider contracts
        run: python scripts/run_test_lane.py live-provider

      - name: Upload live-provider timing artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-timing-live-provider-python-3.13
          path: .test-results/live-provider*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
