[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sharpmod"
dynamic = ["version"]
description = "A modernized, standalone fork of the SHARPpy sounding renderer (Python 3.11-3.13, NumPy 1.24+, Qt6/PySide6)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "SHARPpy Reimagined maintainers" }]
keywords = [
    "meteorology",
    "sounding",
    "skew-t",
    "skewt",
    "hodograph",
    "sharppy",
    "severe-weather",
    "weather",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

# Bounded runtime dependency pins (Requirement 15.3).
#
# NOTE ON SHARPpy / sutils: the renderer composes the upstream ``sharppy``
# distribution (including its ``sutils`` package) at runtime. Upstream
# ``SHARPpy==1.4.0a5`` is on PyPI, but its wheel metadata carries a stale
# ``numpy==1.15.*`` pin that conflicts with the modern NumPy required here, so
# it cannot be listed as a normal dependency (pip would fail to resolve). It is
# installed through ``scripts/install_sharppy_compat.py``, which hash-verifies
# the official wheel and changes only that requirement metadata before running
# ``pip check``. The ``[render]`` extra documents its transitive packages.
dependencies = [
    "numpy>=1.24,<3.0",
    "PySide6>=6.5,<7.0",
    "qtpy>=2.3,<3.0",
    "python-dateutil>=2.8,<3.0",
    "certifi>=2023.7.22",
    # SHARPpy's declared runtime need (used by its datasources import chain).
    "requests>=2.28,<3.0",
    # Reference-consistent ECAPE (Peters et al. 2023) building blocks are
    # computed via MetPy to agree with the authors' ECAPE_FUNCTIONS oracle
    # (Requirement 5.7); the ECAPE parameter degrades to MISSING without it.
    "metpy>=1.5,<2.0",
    # Analytic ECAPE implementation (Peters et al.) used by sharptab.ecape.
    "ecape>=0.1,<1.0",
]

[project.urls]
Homepage = "https://github.com/ShianMike/SHARPpy-Reimagined"
Repository = "https://github.com/ShianMike/SHARPpy-Reimagined"
Documentation = "https://github.com/ShianMike/SHARPpy-Reimagined/blob/main/docs/USAGE.md"
Issues = "https://github.com/ShianMike/SHARPpy-Reimagined/issues"

[project.optional-dependencies]
# ERA5 / GRIB point-sounding extraction tooling (optional install extra).
era5 = [
    "cdsapi>=0.7.7,<0.8",
    "herbie-data>=2026.3,<2027.0",
    "cfgrib>=0.9.15,<0.10",
    "eccodes>=2.47,<3.0",
    "xarray>=2026.4,<2027.0",
    "numcodecs>=0.11,<1.0",
    "pyproj>=3.5,<4.0",
]
# WRF-ARW (wrfout NetCDF) point-sounding extraction tooling (optional extra).
wrf = [
    "xarray>=2024.7,<2027.0",
    "netCDF4>=1.7,<2.0",
]
# Transitive packages the upstream SHARPpy render stack needs. The compatibility
# installer installs this extra by default and then installs the verified,
# metadata-corrected upstream wheel.
render = [
    "requests>=2.28,<3.0",
]
# Development / test tooling: pytest + Hypothesis power the property-based and
# unit test suites (shared ``profiles()`` strategy, >=100 iterations).
dev = [
    "pytest>=7.0,<10.0",
    "hypothesis>=6.0,<7.0",
    "pytest-timeout>=2.4,<3.0",
    "PyYAML>=6.0,<7.0",
]
# Repeatable CI quality tooling. These tools are intentionally isolated from
# the runtime dependency surface and pinned so lint/audit behavior cannot drift
# between otherwise identical commits.
quality = [
    "pip-audit==2.10.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.0",
]
# Build frontend for the optional local Rust extension. This does not install
# Rust itself or make the extension a requirement of the Python package.
rust-build = [
    "maturin>=1.9,<2",
]

[project.gui-scripts]
# Windowed (no-console) GUI entry point installed on `pip install .`.
sharpmod-gui = "sharpmod.gui:main"

[project.scripts]
# Console entry points installed on `pip install .`.
sharpmod-render = "sharpmod.render:main"
uwyo-sounding = "sharpmod.tools.uwyo_sounding:main"
observed-sounding = "sharpmod.tools.observed_sounding:main"
era5-extract = "sharpmod.tools.era5_extract:main"
model-extract = "sharpmod.tools.model_extract:main"
model-batch-extract = "sharpmod.tools.batch_extract:main"
wrf-extract = "sharpmod.tools.wrf_extract:main"
sharpmod-rust-sync = "sharpmod.tools.rust_backend_sync:main"

[tool.pytest.ini_options]
testpaths = ["sharpmod/tests"]
python_files = ["test_*.py"]
timeout = 180
timeout_method = "thread"
markers = [
    "property: Hypothesis-powered scientific/property coverage",
    "live_provider: opt-in checks against current public data providers",
]
filterwarnings = [
    # Fail on every warning except exact, documented compatibility noise from
    # pinned scientific dependencies. This prevents a warning backlog from
    # silently returning.
    "error",
    "ignore:Warning.*converting a masked element to nan:UserWarning",
    "ignore:datetime\\.datetime\\.utcnow\\(\\) is deprecated.*:DeprecationWarning:sharppy\\.io\\.spc_decoder",
    "ignore:The 'warn' method is deprecated, use 'warning' instead:DeprecationWarning:gribapi\\.bindings",
    "ignore:Temperature argument is unused and will be deprecated.*:PendingDeprecationWarning:ecape\\.calc",
    "ignore:invalid value encountered in scalar divide:RuntimeWarning:sharppy\\.sharptab\\.params",
    "ignore:divide by zero encountered in scalar divide:RuntimeWarning:sharppy\\.sharptab\\.params",
    "ignore:divide by zero encountered in scalar divide:RuntimeWarning:sharppy\\.sharptab\\.winds",
    "ignore:invalid value encountered in scalar multiply:RuntimeWarning:sharppy\\.sharptab\\.winds",
    "ignore:divide by zero encountered in log10:RuntimeWarning:sharppy\\.sharptab\\.thermo",
    "ignore:Input line .* contained no data.*:UserWarning:sharppy\\.databases\\.sars",
    "ignore:invalid value encountered in power:RuntimeWarning:sharppy\\.sharptab\\.thermo",
    "ignore:divide by zero encountered in divide:RuntimeWarning:sharppy\\.sharptab\\.thermo",
    "ignore:invalid value encountered in divide:RuntimeWarning:numpy\\.ma\\.extras",
    "ignore:numpy\\.ndarray size changed, may indicate binary incompatibility\\..*:RuntimeWarning",
    "ignore:.*Custom model templates in the config path is deprecated\\..*:DeprecationWarning",
    "ignore:Timestamp\\.utcnow is deprecated.*:DeprecationWarning:herbie\\.core",
]

[tool.coverage.run]
branch = true
source = ["sharpmod"]
omit = ["sharpmod/tests/*"]

[tool.coverage.report]
fail_under = 35
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".gribenv",
    ".griblenv",
    "attic",
    "build",
    "dist",
]

[tool.ruff.lint]
# Apply high-confidence correctness checks across the legacy-heavy tree.
# Focused modules receive the broader rule set in CI.
select = ["E9", "F63", "F7", "F82"]

[tool.setuptools]
# Discover the top-level `sharpmod` package and its subpackages.
packages = [
    "sharpmod",
    "sharpmod.backends",
    "sharpmod.sharptab",
    "sharpmod.io",
    "sharpmod.viz",
    "sharpmod.tools",
    "sharpmod.resources",
    "sharpmod.resources.fonts",
]

[tool.setuptools.dynamic]
version = { attr = "sharpmod._version.__version__" }

[tool.setuptools.package-data]
# Bundle the TTF fonts as package data so they resolve via importlib.resources
# (never absolute paths) — Requirements 15.1, 15.2.
"sharpmod.resources.fonts" = ["*.ttf"]
# Bundle the full UWyo station catalogue, GUI basemap coastlines, and compact
# Census title-place/county indexes so CONUS titles and map context work
# offline.
"sharpmod.resources" = ["*.json", "*.tsv.gz", "*.zip"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc"]
