[package]
name = "sharppy-edge"
version = "3.11.0"
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
worker = "0.9"

[profile.release]
lto = true
opt-level = "s"
