name = "sharppy-reimagined-edge"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-11"
workers_dev = false
preview_urls = false

[build]
command = "worker-build --release"

[vars]
OVH_ORIGIN = "http://127.0.0.1:4198"

[[kv_namespaces]]
binding = "EDGE_STATE"
id = "00000000000000000000000000000000"

[[ratelimits]]
name = "API_LIMIT"
namespace_id = "31001"
simple = { limit = 180, period = 60 }

[[ratelimits]]
name = "READ_LIMIT"
namespace_id = "31002"
simple = { limit = 240, period = 60 }

[triggers]
crons = ["*/5 * * * *"]
