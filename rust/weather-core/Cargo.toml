[package]
name = "sharpmod-weather"
version = "3.4.1"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Shared native weather fetching and processing for SHARPpy Reimagined"
license = "BSD-3-Clause"
repository = "https://github.com/ShianMike/SHARPpy-Reimagined"

[dependencies]
log = "0.4.34"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["parsing", "formatting"] }
tokio = { version = "1.53.3", features = ["sync", "time", "macros", "rt-multi-thread"] }
