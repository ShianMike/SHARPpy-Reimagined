[package]
name = "sharppy-reimagined"
version = "3.3.0"
edition = "2021"
rust-version = "1.90"          # rust-version of tauri 2.12.1, tauri-build 2.7.1, tauri-plugin-log 2.10.0
publish = false

[lib]
name = "sharppy_reimagined_lib"
crate-type = ["rlib"]          # desktop only

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
base64 = "=0.22.1"             # sounding PNGs arrive base64 in bridge frames; already in the graph
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-log = "=2.10.0"
# Windows updates use signed NSIS executables; legacy v1 ZIP extraction is unused.
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["parsing"] } # RFC 3339 timestamps; already in the graph through tauri-plugin-log
tokio = { version = "1.53.2", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tauri = { version = "=2.12.1", features = ["test"] }
tokio = { version = "1.53.2", features = ["test-util"] }
